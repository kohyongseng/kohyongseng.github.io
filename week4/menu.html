<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="css/css_menu.css">
</head>

<body>
    <div class="menu">

        <div class="logo flex">
            <img src="image/logo-light.png" alt="logo">
        </div>

        <div class="work flex">
            <p>Home</p>
            <p class="services">Services</p>
            <p>Work</p>
            <p>Project Details</p>
            <p>Contact</p>
        </div>

        <div class="flex">
            <div class="phone">
                <img src="image/phone-call.png" alt="phone" width="25px" height="25px">
                <p>555-123-4567</p>
            </div>

            <div class="hamburger">
                <img src="image/hamburger.png" alt="hamburger" width="25px" height="25px">
            </div>

            <div class="button">
                <button>Contact</button>
            </div>

        </div>

    </div>
</body>

</html>
